name: ⚪ Deploy Worker (Multi-Account)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_1:
        description: "Deploy to Account 1 — rename this to your account's label, e.g. 'Deploy to Personal'"
        required: false
        type: boolean
        default: true
      account_2:
        description: "Deploy to Account 2 — rename this to your account's label"
        required: false
        type: boolean
        default: false
      account_3:
        description: "Deploy to Account 3 — rename this to your account's label"
        required: false
        type: boolean
        default: false
      account_4:
        description: "Deploy to Account 4 — rename this to your account's label"
        required: false
        type: boolean
        default: false
      workername:
        description: "Optional: Enter a specific Worker name for this run (lowercase only)"
        required: false
        default: "0x00"
      proxyip:
        description: "Optional: Enter a specific Proxy IP/host for this run"
        required: false
        default: di.nscl.ir
      uuid:
        description: "Optional: Enter a specific UUID for this run (leave blank to generate a random one)"
        required: false
        default: ""
      placement_mode:
        description: "Optional: Worker Placement — off / smart / region / host / hostname"
        required: false
        type: choice
        options:
          - "off"
          - "smart"
          - "region"
          - "host"
          - "hostname"
        default: "off"
      placement_provider:
        description: "Only used when placement_mode = region: cloud provider"
        required: false
        type: choice
        options:
          - "aws"
          - "gcp"
          - "azure"
        default: "aws"
      placement_region:
        description: "Only used when placement_mode = region: region code, e.g. us-east-1 (aws) / us-east4 (gcp) / westeurope (azure)"
        required: false
        default: ""
      placement_host:
        description: "Only used when placement_mode = host: host:port to probe over TCP, e.g. db.example.com:5432"
        required: false
        default: ""
      placement_hostname:
        description: "Only used when placement_mode = hostname: hostname to probe over HTTP, e.g. api.example.com"
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: ▶ Build account matrix
        id: build
        env:
          EVENT: ${{ github.event_name }}
          SEL_1: ${{ inputs.account_1 }}
          SEL_2: ${{ inputs.account_2 }}
          SEL_3: ${{ inputs.account_3 }}
          SEL_4: ${{ inputs.account_4 }}
        run: |
          ITEMS="[]"
          add() { ITEMS=$(echo "$ITEMS" | jq --argjson n "$1" '. + [{"index": $n}]'); }

          if [ "$EVENT" != "workflow_dispatch" ]; then
            add 1
          else
            [ "$SEL_1" = "true" ] && add 1
            [ "$SEL_2" = "true" ] && add 2
            [ "$SEL_3" = "true" ] && add 3
            [ "$SEL_4" = "true" ] && add 4
          fi

          if [ "$(echo "$ITEMS" | jq 'length')" = "0" ]; then
            echo "::error::No Cloudflare account selected - tick at least one account checkbox and re-run."
            exit 1
          fi

          echo "matrix=$(echo "$ITEMS" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: ▶ Checkout code
        uses: actions/checkout@v7

      - name: ▶ Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ▶ Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: ▶ Resolve account credentials (#${{ matrix.index }})
        id: account
        env:
          API_TOKEN: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.index)] }}
          ACCOUNT_ID: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.index)] }}
          ACCOUNT_LABEL: ${{ vars[format('CLOUDFLARE_ACCOUNT_{0}_LABEL', matrix.index)] }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Account #${{ matrix.index }} is selected but its CLOUDFLARE_API_TOKEN_${{ matrix.index }} / CLOUDFLARE_ACCOUNT_ID_${{ matrix.index }} secrets aren't set."
            exit 1
          fi
          LABEL="${ACCOUNT_LABEL:-Account ${{ matrix.index }}}"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: ▶ Resolve UUID
        id: uuidval
        env:
          INPUT_UUID: ${{ inputs.uuid }}
          SECRET_UUID: ${{ secrets[format('UUID_{0}', matrix.index)] || secrets.UUID }}
        run: |
          UUID_REGEX="^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          FALLBACK_UUID="be0ff9df-1468-41a0-8865-796d1c6800db"

          if [ -n "$INPUT_UUID" ]; then
            UUID_VALUE="$INPUT_UUID"
          elif [ -n "$SECRET_UUID" ]; then
            UUID_VALUE="$SECRET_UUID"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UUID_VALUE=$(curl -s --max-time 5 https://www.uuidgenerator.net/api/version4 | tr -d '\n\r ')
            if ! [[ "$UUID_VALUE" =~ $UUID_REGEX ]]; then
              UUID_VALUE="$FALLBACK_UUID"
            fi
          else
            UUID_VALUE="$FALLBACK_UUID"
          fi

          if ! [[ "$UUID_VALUE" =~ $UUID_REGEX ]]; then
            UUID_VALUE="$FALLBACK_UUID"
          fi

          echo "::add-mask::$UUID_VALUE"
          UUID_SUFFIX="${UUID_VALUE: -4}"
          UUID_MASKED="••••••••-••••-••••-$UUID_SUFFIX"
          echo "uuid_masked=$UUID_MASKED" >> "$GITHUB_OUTPUT"
          echo "uuid=$UUID_VALUE" >> "$GITHUB_OUTPUT"

      - name: ▶ Resolve PROXYIP
        id: proxyval
        env:
          INPUT_PROXYIP: ${{ inputs.proxyip }}
          SECRET_PROXYIP: ${{ secrets[format('PROXYIP_{0}', matrix.index)] || secrets.PROXYIP }}
        run: |
          if [ -n "$INPUT_PROXYIP" ]; then
            PROXY_VALUE="$INPUT_PROXYIP"
          elif [ -n "$SECRET_PROXYIP" ]; then
            PROXY_VALUE="$SECRET_PROXYIP"
          else
            PROXY_VALUE="di.nscl.ir"
          fi
          echo "proxyip=$PROXY_VALUE" >> "$GITHUB_OUTPUT"

      - name: ▶ Resolve Placement Hint
        id: placementval
        env:
          INPUT_MODE: ${{ inputs.placement_mode }}
          INPUT_PROVIDER: ${{ inputs.placement_provider }}
          INPUT_REGION: ${{ inputs.placement_region }}
          INPUT_HOST: ${{ inputs.placement_host }}
          INPUT_HOSTNAME: ${{ inputs.placement_hostname }}
          SECRET_MODE: ${{ secrets.PLACEMENT_MODE }}
          SECRET_PROVIDER: ${{ secrets.PLACEMENT_PROVIDER }}
          SECRET_REGION: ${{ secrets.PLACEMENT_REGION }}
          SECRET_HOST: ${{ secrets.PLACEMENT_HOST }}
          SECRET_HOSTNAME: ${{ secrets.PLACEMENT_HOSTNAME }}
        run: |
          MODE="${INPUT_MODE:-$SECRET_MODE}"
          MODE="${MODE:-off}"
          case "$MODE" in
            off|smart|region|host|hostname) ;;
            *) MODE="off" ;;
          esac

          PROVIDER="${INPUT_PROVIDER:-$SECRET_PROVIDER}"
          PROVIDER="${PROVIDER:-aws}"
          case "$PROVIDER" in
            aws|gcp|azure) ;;
            *) PROVIDER="aws" ;;
          esac

          REGION="${INPUT_REGION:-$SECRET_REGION}"
          HOST_VALUE="${INPUT_HOST:-$SECRET_HOST}"
          HOSTNAME_VALUE="${INPUT_HOSTNAME:-$SECRET_HOSTNAME}"

          KEY=""
          VALUE=""
          SUMMARY="off"

          if [ "$MODE" = "smart" ]; then
            KEY="mode"; VALUE="smart"; SUMMARY="smart"
          elif [ "$MODE" = "region" ] && [ -n "$REGION" ]; then
            KEY="region"; VALUE="${PROVIDER}:${REGION}"; SUMMARY="region (${VALUE})"
          elif [ "$MODE" = "host" ] && [ -n "$HOST_VALUE" ]; then
            KEY="host"; VALUE="$HOST_VALUE"; SUMMARY="host (${VALUE})"
          elif [ "$MODE" = "hostname" ] && [ -n "$HOSTNAME_VALUE" ]; then
            KEY="hostname"; VALUE="$HOSTNAME_VALUE"; SUMMARY="hostname (${VALUE})"
          fi

          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: ▶ Resolve worker name
        id: worker
        env:
          SECRET_WORKERNAME: ${{ secrets[format('WORKERNAME_{0}', matrix.index)] }}
        run: |
          DEFAULT_NAME=$(grep -m1 '^name' wrangler.toml | sed -E 's/name[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          NAME="${{ inputs.workername }}"
          if [ -z "$NAME" ]; then NAME="$SECRET_WORKERNAME"; fi
          if [ -z "$NAME" ]; then NAME="$DEFAULT_NAME"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: ▶ Encode panel
        run: base64 -w0 index.html > src/panel.b64

      - name: ▶ Apply Placement Hint
        if: steps.placementval.outputs.key != ''
        run: |
          {
            echo ""
            echo "[placement]"
            echo "${{ steps.placementval.outputs.key }} = \"${{ steps.placementval.outputs.value }}\""
          } >> wrangler.toml

      - name: "▶ Deploy via Wrangler Action (${{ steps.worker.outputs.name }} → ${{ steps.account.outputs.label }})"
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.index)] }}
          accountId: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.index)] }}
          command: deploy --name ${{ steps.worker.outputs.name }}
          vars: |
            UUID
            PROXYIP
            WORKERNAME
        env:
          UUID: ${{ steps.uuidval.outputs.uuid }}
          PROXYIP: ${{ steps.proxyval.outputs.proxyip }}
          WORKERNAME: ${{ steps.worker.outputs.name }}

      - name: ▶ Deployment Summary
        run: |
          BASE_URL="${{ steps.deploy.outputs.deployment-url }}"
          BASE_URL="${BASE_URL%/}"
          {
            echo "## 🟢 Deployment Successful — ${{ steps.account.outputs.label }}"
            echo ""
            echo "### 📥 Deployment"
            echo ""
            echo "| Property | Value |"
            echo "|:-----|:-----|"
            echo "| **Account** | ${{ steps.account.outputs.label }} (slot ${{ matrix.index }}) |"
            echo "| **Worker** | \`${{ steps.worker.outputs.name }}\` |"
            echo "| **Base URL** | $BASE_URL |"
            echo "| **Status** | Deployed successfully |"
            echo ""
            echo "### ⚙️ Configuration"
            echo ""
            echo "| Property | Value |"
            echo "|:-----|:-----|"
            echo "| **PROXYIP** | \`${{ steps.proxyval.outputs.proxyip }}\` |"
            echo "| **UUID** | \`${{ steps.uuidval.outputs.uuid_masked }}\` |"
            echo "| **Placement** | \`${{ steps.placementval.outputs.summary }}\` |"
            echo ""
            echo "### 🔐 Access to panel"
            echo ""
            echo "Your UUID is not displayed because this repository is public."
            echo ""
            echo "To access the panel:"
            echo ""
            echo "\`$BASE_URL/<UUID>\`"
            echo ""
            echo "Get your UUID from:"
            echo ""
            echo "☁️ Cloudflare Dashboard"
            echo "→ Workers & Pages"
            echo "→ **${{ steps.worker.outputs.name }}**"
            echo "→ Settings → Variables and Secrets"
            echo ""
            echo "💡 [Open Cloudflare Dashboard](https://dash.cloudflare.com/?to=/:account/workers-and-pages)"
          } >> "$GITHUB_STEP_SUMMARY"
